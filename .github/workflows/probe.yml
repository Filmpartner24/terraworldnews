name: Cloudflare probe (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['probe/.run']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: python3 tools/cf_probe.py
      - name: Commit
        run: |
          git config user.name "terra-bot"
          git config user.email "media@filmpartner24.com"
          git add -A probe
          git diff --cached --quiet || (git commit -m "Probe [CF-Pages-Skip] [skip ci]" && git pull --rebase -q && git push)
