name: Daily analytics (Cloudflare Web Analytics)
on:
  schedule:
    - cron: '40 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch analytics
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: python3 tools/cf_analytics.py
      - name: Commit
        run: |
          git config user.name "terra-bot"
          git config user.email "media@filmpartner24.com"
          git add -A analytics
          git diff --cached --quiet || (git commit -m "Analytics update [skip ci]" && git pull --rebase -q && git push)
