name: Fetch article photos
on:
  push:
    branches: [main]
    paths: ['content/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python3 tools/fetch_images.py
      - name: Commit new photos
        run: |
          git config user.name "terra-bot"
          git config user.email "media@filmpartner24.com"
          git add static/assets/news
          git diff --cached --quiet || (git commit -m "Add article photos" && git push)
