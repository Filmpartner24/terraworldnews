name: Football tables after full-time
# Nedys Vorgabe (15.10.2026): Tabellen unmittelbar nach den Spielen aktualisieren.
# Läuft nur zu den typischen Abpfiff-Zeiten (~25 Läufe pro Woche) und committet nur, wenn sich Daten geändert haben.
on:
  schedule:   # sparsam (Nedy 15.10.2026): nur kurz nach den typischen Abpfiffzeiten; Zeiten in UTC (= MEZ − 1 h, im Sommer bis zu 1 h später)
    - cron: '50 19 * * 2,3,4'         # Di–Do 20:50 MEZ: Europapokal 18:45-Spiele
    - cron: '5 22 * * 2,3,4'          # Di–Do 23:05 MEZ: Europapokal/Pokal 21:00-Spiele
    - cron: '35 21 * * 1,5'           # Mo + Fr 22:35 MEZ: Abendspiele
    - cron: '30 16 * * 6,0'           # Sa + So 17:30 MEZ: 15:30-Spiele
    - cron: '30 19 * * 6'             # Sa 20:30 MEZ: Topspiel 18:30
    - cron: '30 18 * * 0'             # So 19:30 MEZ: 17:30-Spiele
    - cron: '15 22 * * 6,0'           # Sa + So 23:15 MEZ: späte Spiele in England/Spanien/Italien/Frankreich
    - cron: '5 6 * * *'               # täglich 07:05 MEZ: Nachträge (openfootball trägt Ergebnisse oft erst nachts ein)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scores
  cancel-in-progress: false
jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch results and rebuild league data
        run: python3 tools/update_scores.py
      - name: Check data (schneller als ein kompletter Build)
        run: python3 -c "import json,glob; [json.load(open(f, encoding='utf-8')) for f in glob.glob('content/football/*.json')]"
      - name: Commit
        run: |
          git config user.name "terra-bot"
          git config user.email "media@filmpartner24.com"
          git add content/football
          git diff --cached --quiet && { echo "keine neuen Ergebnisse"; exit 0; }
          git commit -m "Tabellen nach Abpfiff aktualisiert"
          for i in 1 2 3 4 5; do git push && exit 0; sleep $((i*5)); git pull --rebase -q || exit 1; done
          exit 1
