name: TR/ES Probelauf (nur Sprach-Branch)
on:
  push:
    branches: [feature/sprachen-tr-es]
permissions:
  contents: write
jobs:
  probe:
    if: ${{ contains(github.event.head_commit.message, '[translate-test]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Probe-Übersetzung
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_IDS: ${{ vars.TRANSLATE_IDS }}
        run: |
          IDS=$(cat i18n/probe_ids.txt | tr '\n' ',')
          TRANSLATE_IDS="$IDS" python3 tools/translate.py
      - name: Commit
        run: |
          git config user.name "terra-bot"
          git config user.email "media@filmpartner24.com"
          git add translations
          git diff --cached --quiet && exit 0
          git commit -m "TR/ES Probeübersetzungen"
          git push
