name: Photos, build check and search-engine ping
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: photos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Unpack uploaded bundle (if any)
        run: |
          if ls bundle*.tar.gz >/dev/null 2>&1; then
            for b in bundle*.tar.gz; do tar -xzf "$b"; git rm -q "$b"; done
          fi
      - run: pip install pillow
      - name: Download bridge
        run: python3 tools/fetch_urls.py
      - name: Photo candidates from Wikimedia Commons
        run: python3 tools/commons_candidates.py
      - run: python3 tools/fetch_images.py
      - name: Commit
        run: |
          git config user.name "terra-bot"
          git config user.email "media@filmpartner24.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update edition and photos"
          for i in 1 2 3 4 5; do git push && exit 0; sleep $((i*5)); git pull --rebase -q || exit 1; done
          exit 1
      - name: Build site (for sitemap)
        if: ${{ !contains(github.event.head_commit.message, '[CF-Pages-Skip]') }}
        run: PYTHONHASHSEED=1 python3 build.py
      - name: Notify search engines via IndexNow
        # kein Warten mehr auf Cloudflare (sparte 4 Minuten Actions-Zeit pro Lauf); Suchmaschinen holen die Seiten ohnehin zeitversetzt ab
        if: ${{ !contains(github.event.head_commit.message, '[CF-Pages-Skip]') }}
        run: python3 tools/indexnow.py
