name: Google-Wache (Cloudflare, nur lesen)
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['guard/.run']
permissions:
  contents: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          CF_ZONE_TOKEN: ${{ secrets.CF_ZONE_TOKEN }}
        run: python3 tools/cf_guard.py
      - name: Commit
        run: |
          git config user.name "terra-bot"
          git config user.email "media@filmpartner24.com"
          git add -A guard
          git diff --cached --quiet || (git commit -m "Google-Wache [CF-Pages-Skip] [skip ci]" && git pull --rebase -q && git push)
